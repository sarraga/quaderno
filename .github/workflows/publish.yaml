name: publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify release tag matches quaderno.__version__
        run: |
          python -c "
          import ast, os
          tree = ast.parse(open('quaderno/__init__.py').read())
          ver = next(
              ast.literal_eval(n.value)
              for n in tree.body
              if isinstance(n, ast.Assign)
              and any(isinstance(t, ast.Name) and t.id == '__version__' for t in n.targets)
          )
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert tag == ver, f'tag {tag!r} != __version__ {ver!r}'
          "
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          twine check --strict dist/*
      - name: Test installed wheel
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl pytest mypy
          (cd /tmp && /tmp/wheel-test/bin/python -c "import os, quaderno; assert quaderno.__version__ == os.environ['GITHUB_REF_NAME'].removeprefix('v')" && /tmp/wheel-test/bin/quaderno --help >/dev/null)
          /tmp/wheel-test/bin/python -m pytest
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
