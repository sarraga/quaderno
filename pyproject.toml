[project]
name = "quaderno"
version = "0.3.0"
description = "Python API and command-line client for the Fujitsu QUADERNO e-paper tablet over USB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.scripts]
quaderno = "quaderno.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["quaderno"]
